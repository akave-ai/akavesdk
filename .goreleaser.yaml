version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: akavecli
    binary: akavecli
    main: ./cmd/akavecli/
    ldflags:
      - -X "github.com/akave-ai/akavesdk/private/version.tag={{.Version}}"
      - -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    format: binary
    name_template: >-
      akavecli-
      {{- .Os }}-
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

changelog:
  format: "{{.SHA}}: {{.Message}} (@{{.AuthorUsername}})"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  mode: append
  prerelease: auto
  header: |
    ## Install

    **Linux/macOS (one-liner):**
    ```sh
    curl -sSL https://raw.githubusercontent.com/akave-ai/akavesdk/main/install.sh | bash
    ```

    **Or with [eget](https://github.com/zyedidia/eget):**
    ```sh
    eget akave-ai/akavesdk --asset akavecli
    ```

  extra_files:
    - glob: ./install.sh
